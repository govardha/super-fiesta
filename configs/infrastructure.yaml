globals:
  vpc:
    cidr: "10.0.0.0/16"
    max_azs: 4
    subnet_mask: 24
    enable_dns_hostnames: true
    enable_dns_support: true
    nat_gateways: 0

  ec2:
    instance_type: "t3.micro"
    instance_class: "BURSTABLE2"
    instance_size: "MICRO"
    amazon_linux_edition: "STANDARD"
    virtualization: "HVM"
    storage: "GENERAL_PURPOSE"
    key_name: "govardha-ddev-demo"
    ami_id: "ami-0e86e20dae9224db8"

  compute:
    almalinux_amis:
      us-east-1:
        "8": "-0825c833650fed842" # AlmaLinux OS 8.10 x86_64
        "9": "ami-085a9166f08849956" # AlmaLinux OS 9.6 x86_64

    asg:
      enabled: true
      primary_instance_type: "m5.large"
      alternative_instance_types:
        - "m5a.large"
        - "m5n.large"
        - "m6i.large"
        - "m4.large"
        - "m5d.large"
        - "m5ad.large"
      min_capacity: 1
      max_capacity: 1
      desired_capacity: 1
      on_demand_percentage: 0
      health_check_grace_period: 300
      notification_email: null
      # Automatic refresh
      enable_daily_refresh: true
      refresh_hour: 3
      refresh_only_on_demand: true
      enable_aggressive_spot_refresh: true
      aggressive_refresh_interval_minutes: 15

    instances:
      - name: "compute-01"
        instance_type: "m5.large" # Specify EC2 instance type directly
        ebs_volume_size: 20 # GB
        ebs_volume_type: "GP3" # GP3, GP2, IO1, IO2, etc.
        ebs_iops: 3000 # Only for GP3, IO1, IO2
        ebs_throughput: 125 # Only for GP3 (MiB/s)
        os: "almalinux" # almalinux, ubuntu, amazonlinux2
        os_version: "8" # 8 or 9 for AlmaLinux
        enable_ssh: false # No SSH key pair
        enable_ssm: true # SSM for access
        enable_tailscale: true # Install Tailscale
        subnet_type: "PRIVATE_WITH_EGRESS" # or PUBLIC
        tailscale_auth_key_env: "TAILSCALE_AUTH_KEY" # Env var name for auth key
        use_spot: true
        spot_max_price: null
        data_volume_size: 100 # 100GB persistent data
        data_volume_type: "GP3"
        data_volume_mount_point: "/data"
        data_volume_device_name: "/dev/sdf"

  logging:
    flow_logs_group_name: "/aws/vpc/flowlogs"
    retention_days: 2

  waf:
    enabled: true
    name: "DdevWaf"
    description: "WAF for DDEV Demo Stack"
    cloudwatch_metrics_enabled: true
    sampled_requests_enabled: true
    blocked_countries:
      - "RU" # Russia
      - "CN" # China
      - "KP" # North Korea
      - "IR" # Iran (optional)
    # IP Allow List (CIDR blocks)
    allowed_ips:
      - "0.0.0.0/0"
    # AWS Managed Rules (boolean controls)
    aws_common_rule_set: true # AWS Core Rule Set
    aws_known_bad_inputs: true # Known Bad Inputs
    aws_sql_injection: true # SQL Injection Protection
    aws_xss_protection: true # XSS Protection
    aws_rate_limiting: false # Rate limiting (can be expensive)
    rate_limit_requests: 500 # Requests per 5 minutes if rate limiting enabled

  endpoints:
    services:
      - name: "ssm"
        service: "SSM"
      - name: "ssm_messages"
        service: "SSM_MESSAGES"
      - name: "ec2_messages"
        service: "EC2_MESSAGES"
      - name: "ec2"
        service: "EC2"
      - name: "sts"
        service: "STS"
      - name: "logs"
        service: "CLOUDWATCH_LOGS"

  opnsense_lab:
    vpc:
      cidr: "10.10.0.0/16"
      max_azs: 2
      subnet_mask: 24
    instance_type: "t3a.micro"
    os_version: "9"
    ebs_volume_size: 50
    opnsense_ami: "ami-0c7eb0df432665ef3"
    opnsense_instance_type: "t3a.small"
    key_pair_name: "opnsense-lab-key"

accounts:
  - name: sandbox
    account: "${SANDBOX_ACCOUNT_ID}" # Environment variable
    region: "${SANDBOX_REGION}" # Environment variable
    vpc:
      cidr: "10.1.0.0/16"
    ec2:
      instance_type: "t3.micro"
    compute:
      asg:
        enabled: true
        primary_instance_type: "m5.large"
        alternative_instance_types:
          - "m5a.large"
          - "m5n.large"
          - "m6i.large"
          - "m4.large"
          - "m5d.large"
          - "m5ad.large"
        on_demand_percentage: 0
        notification_email: "${NOTIFICATION_EMAIL}"
        enable_daily_refresh: true
        refresh_hour: 3
        refresh_only_on_demand: true
        enable_aggressive_spot_refresh: true
        aggressive_refresh_interval_minutes: 15

  - name: production
    account: "${PRODUCTION_ACCOUNT_ID}" # Environment variable
    region: "${PRODUCTION_REGION}" # Environment variable
    vpc:
      cidr: "10.2.0.0/16"
      max_azs: 3
    ec2:
      instance_type: "t3.small"
      instance_class: "BURSTABLE2"
      instance_size: "SMALL"
    logging:
      retention_days: 30

  - name: development
    account: "${DEV_ACCOUNT_ID}" # Environment variable
    region: "${DEV_REGION}" # Environment variable
    vpc:
      cidr: "10.3.0.0/16"
    ec2:
      instance_type: "t3.nano"
